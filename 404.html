<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0a0e17">
  <title>Page Not Found | Nexus Layer AI</title>
  <link rel="canonical" href="https://nexuslayer.io/404.html">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root{color-scheme:dark;--bg:#0a0e17;--card:#111827;--cyan:#00d2ff;--muted:#9ca3af}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:2rem;background:var(--bg);color:#f3f4f6;font:16px/1.6 system-ui,sans-serif}
    main{max-width:620px;text-align:center;padding:3rem 2rem;background:var(--card);border:1px solid #1f2937;border-radius:14px}
    .code{color:var(--cyan);font-size:1rem;letter-spacing:.2em}h1{font-size:2.2rem;margin:.5rem 0 1rem}p{color:var(--muted)}
    a{display:inline-block;margin-top:1rem;padding:.8rem 1.3rem;border-radius:6px;background:linear-gradient(90deg,#00d2ff,#3a7bd5);color:#07111d;font-weight:700;text-decoration:none}
    a:focus-visible{outline:3px solid white;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <div class="code">ERROR 404</div>
    <h1>This page could not be found</h1>
    <p>The page may have moved or the address may be incorrect. Return to the Nexus Layer AI homepage to continue.</p>
    <a href="/">Go to the homepage</a>
  </main>
</body>
</html>
